services:
  postgres:
    image: pgvector/pgvector:pg17
    # PowerSync replicates through logical decoding.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sipclock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipclock}
      POSTGRES_DB: ${POSTGRES_DB:-sipclock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sync service for the mobile app, http://localhost:8080. Needs the API on the host (`pnpm --filter @sipclock/api dev`,
  # port 8787) for the JWKS, and the API migration (tables + `powersync` publication) before it can replicate.
  # It logs replication errors until then. Config: infra/powersync.
  powersync:
    image: journeyapps/powersync-service:1.26.1
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_PG_URI: postgresql://powersync_role:powersync@postgres:5432/${POSTGRES_DB:-sipclock}
      PS_STORAGE_URI: postgresql://powersync_role:powersync@postgres:5432/powersync_storage
      PS_JWKS_URI: ${PS_JWKS_URI:-http://host.docker.internal:8787/api/auth/jwks}
    volumes:
      - ./infra/powersync:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://${POSTGRES_USER:-sipclock}:${POSTGRES_PASSWORD:-sipclock}@postgres:5432/${POSTGRES_DB:-sipclock}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-32-chars-min!!}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8787:8787"

volumes:
  pgdata:
