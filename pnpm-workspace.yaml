packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  # promptfoo (evals) optional/heavy extras; not needed for the substitutes suite.
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
  protobufjs: false
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/ui@57.0.21'
  - '@hono/node-server@2.1.3'
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - '@scalar/client-side-rendering@0.4.6'
  - '@scalar/helpers@0.16.0'
  - '@scalar/hono-api-reference@0.12.7'
  - '@scalar/schemas@0.12.2'
  - '@scalar/types@0.22.2'
  - '@sentry/browser-utils@11.1.0'
  - '@sentry/browser@11.1.0'
  - '@sentry/bundler-plugins@11.1.0'
  - '@sentry/core@11.1.0'
  - '@sentry/feedback@11.1.0'
  - '@sentry/nextjs@11.1.0'
  - '@sentry/node@11.1.0'
  - '@sentry/opentelemetry@11.1.0'
  - '@sentry/react@11.1.0'
  - '@sentry/replay-canvas@11.1.0'
  - '@sentry/replay@11.1.0'
  - '@sentry/server-runtime-injection@11.1.0'
  - '@sentry/server-utils@11.1.0'
  - '@sentry/vercel-edge@11.1.0'
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-router@57.0.24
  - expo@57.0.26
  - hono@4.13.11
  - next@16.3.7

# React Native 0.86 needs the matching Metro config; pnpm otherwise auto-installs the latest optional peer.
overrides:
  '@react-native/metro-config': 0.86.3
