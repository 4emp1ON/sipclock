# Sipclock production stack on the VPS: Postgres, a one-shot migration job and the API.
# The API joins the shared `edge` network (created by deploy/edge) under the alias `sipclock-api`.
name: sipclock

x-image: &image ghcr.io/4emp1on/sipclock-api:${SIPCLOCK_TAG:-latest}
x-database-url: &database-url postgres://sipclock:${POSTGRES_PASSWORD:?}@postgres:5432/sipclock

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # PowerSync replicates through logical decoding. The slot cap stops an abandoned slot from filling the disk.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      POSTGRES_USER: sipclock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: sipclock
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipclock -d sipclock"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [internal]

  migrate:
    image: *image
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    image: *image
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    networks:
      internal:
      edge:
        aliases: [sipclock-api]

  # Sync service for the mobile app. Public through the edge router at /sipclock/powersync (alias `sipclock-powersync`).
  # Needs the role and storage database from powersync-setup.sql, and the API migration (tables + publication).
  powersync:
    image: journeyapps/powersync-service:${POWERSYNC_TAG:-1.26.1}
    command: ["start", "-r", "unified"]
    restart: unless-stopped
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size-percentage=80
      PS_PG_URI: postgresql://powersync_role:${POWERSYNC_DB_PASSWORD:?}@postgres:5432/sipclock
      PS_STORAGE_URI: postgresql://powersync_role:${POWERSYNC_DB_PASSWORD:?}@postgres:5432/powersync_storage
      PS_JWKS_URI: http://api:8787/api/auth/jwks
    volumes:
      - ./powersync:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    networks:
      internal:
      edge:
        aliases: [sipclock-powersync]

networks:
  internal:
  edge:
    external: true

volumes:
  pg-data:
